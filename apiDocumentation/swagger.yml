openapi: 3.0.3
info:
  title: Identity Service API
  description: JWT-based authentication service for user sign-up and sign-in.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /auth/signup:
    post:
      tags:
        - auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRegister'
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "409":
          description: Username or email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/signin:
    post:
      tags:
        - auth
      summary: Authenticate and issue JWT
      description: Returns a bearer token with the user id stored in the JWT subject.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    SignUpRegister:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          example: aikyn
        email:
          type: string
          format: email
          example: aikyn@mathalama.dev
        password:
          type: string
          format: password
          example: newPassword
    SignInRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          description: Username or email.
          example: aikyn
        password:
          type: string
          format: password
          example: password
    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT bearer token.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: User registered successfully
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 409
        error:
          type: string
          example: Conflict
        message:
          type: string
          example: Username or email already exists
        path:
          type: string
          example: /auth/signup
        timestamp:
          type: string
          format: date-time
          example: "2026-02-20T12:00:00"
